name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: "scheme"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rootless
          - rootful
          - roothide

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: set matrix
        id: set-matrix
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "all" ]; then
            echo 'matrix=["rootless","rootful","roothide"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$SCHEME\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    env:
      DEVICE_TARGET: "iphone:clang:16.5:14.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: build (${{ matrix.scheme }})
        run: |
          SCHEME_FLAG=""
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=rootless"
          elif [ "${{ matrix.scheme }}" = "roothide" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=roothide"
          fi
          make clean
          make package \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            $SCHEME_FLAG

      - name: upload package (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-package
          path: packages/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-packages
          pattern: "*-package"
          merge-multiple: true

      - name: read version
        id: version
        run: |
          DEB_FILE=$(ls ./all-packages/*.deb 2>/dev/null | head -1)
          if [ -n "$DEB_FILE" ]; then
            BASENAME=$(basename "$DEB_FILE")
            VERSION=$(echo "$BASENAME" | sed -n 's/.*_\([^_]*\)_.*/\1/p')
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "tag=v$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: create per-version release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./all-packages/*.deb"
          tag: ${{ steps.version.outputs.tag }}
          name: "LiquidAss ${{ steps.version.outputs.version }}"
          body: |
            **版本:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            ### 下载说明
            - **rootless**: 适用于 Dopamine / Palera1n rootless 越狱
            - **rootful**: 适用于传统 rootful 越狱
            - **roothide**: 适用于 Palera1n roothide 越狱
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: false

      - name: bump version and push
        run: |
          # 读取当前版本
          CURRENT_VERSION=$(sed -n 's/^Version: //p' control | head -n 1)
          echo "Current version: $CURRENT_VERSION"

          # 递增版本号：支持 0.1.7b 格式（数字部分递增，保留字母后缀）
          # 提取最后一个数字并递增
          NEW_VERSION=$(echo "$CURRENT_VERSION" | perl -pe 's/(\d+)(?=\D*$)/$1+1/e')
          echo "New version: $NEW_VERSION"

          # 更新 control 文件
          sed -i "s/^Version: .*/Version: $NEW_VERSION/" control

          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 提交并推送（带 [skip ci] 避免触发循环构建）
          git add control
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
