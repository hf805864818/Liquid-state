name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: "scheme"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rootless
          - rootful
          - roothide

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: set matrix
        id: set-matrix
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "all" ]; then
            echo 'matrix=["rootless","rootful","roothide"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$SCHEME\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    env:
      DEVICE_TARGET: "iphone:clang:16.5:14.0"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: build (${{ matrix.scheme }})
        run: |
          SCHEME_FLAG=""
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=rootless"
          elif [ "${{ matrix.scheme }}" = "roothide" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=roothide"
          fi
          make clean
          make package \
            ARCHS="arm64 arm64e" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            $SCHEME_FLAG

      - name: rename deb (${{ matrix.scheme }})
        run: |
          for f in packages/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ver=$(echo "$base" | sed -n 's/.*_\([^_]*\)_.*/\1/p')
            # 先用 ASCII 安全名，避免 artifact 传输损坏中文
            mv "$f" "packages/liquidglass_${ver}_${{ matrix.scheme }}.deb"
          done

      - name: upload package (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-package
          path: packages/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-packages
          pattern: "*-package"
          merge-multiple: true

      - name: verify and rename packages
        run: |
          ls -la ./all-packages/
          cd ./all-packages
          python3 -c "
          import os, glob, re
          for f in glob.glob('liquidglass_*.deb'):
              base = os.path.basename(f)
              # 提取 scheme
              scheme = ''
              if 'rootless' in base:
                  scheme = 'rootless'
              elif 'roothide' in base:
                  scheme = 'roothide'
              elif 'rootful' in base:
                  scheme = 'rootful'
              # 提取版本号
              m = re.search(r'_([0-9]+\.[0-9]+\.[0-9]+[a-z]?)_', base)
              if not m:
                  m = re.search(r'_([0-9]+\.[0-9]+[a-z]?)_', base)
              if m and scheme:
                  ver = m.group(1)
                  newname = f'Ai液态玻璃_{ver}_{scheme}.deb'
                  os.rename(f, newname)
                  print(f'Renamed: {base} -> {newname}')
          "
          ls -la

      - name: read version
        id: version
        run: |
          python3 -c "
          import os, glob, re
          for f in glob.glob('./all-packages/*.deb'):
              base = os.path.basename(f)
              m = re.search(r'_([0-9]+\.[0-9]+\.[0-9]+[a-z]?)_', base)
              if not m:
                  m = re.search(r'_([0-9]+\.[0-9]+[a-z]?)_', base)
              if m:
                  print(f'version={m.group(1)}')
                  print(f'tag=v{m.group(1)}')
                  break
          " >> $GITHUB_OUTPUT

      - name: create per-version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # 先删除已有的同名 tag 和 release（如果存在）
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          # 创建 release（不含 assets，assets 用 curl 逐个上传以保留中文文件名）
          NOTES="**版本:** ${VERSION}
          **Commit:** ${{ github.sha }}

          ### 下载说明
          - **rootless**: 适用于 Dopamine / Palera1n rootless 越狱
          - **rootful**: 适用于传统 rootful 越狱
          - **roothide**: 适用于 Palera1n roothide 越狱"
          gh release create "$TAG" \
            --title "Ai液态玻璃 ${VERSION}" \
            --notes "${NOTES}"

          # 获取 release ID
          RELEASE_ID=$(gh release view "$TAG" --json id -q .id)
          echo "Release ID: $RELEASE_ID"

          # 逐个上传 asset，用 curl + URL 编码的中文名
          # gh release create 的 glob 上传会丢弃非 ASCII 字符，
          # 改用 GitHub Upload API 直接指定 name 参数（URL 编码）
          for f in ./all-packages/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # 提取 scheme
            scheme=$(echo "$base" | grep -oP '(rootless|rootful|roothide)' | head -1)
            # 提取版本号
            ver=$(echo "$base" | sed -n 's/.*_\([^_]*\)_.*/\1/p')
            asset_name="Ai液态玻璃_${ver}_${scheme}.deb"
            # URL 编码
            encoded_name=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$asset_name")
            echo "Uploading: $base -> $asset_name (encoded: $encoded_name)"
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$encoded_name"
            echo ""
          done

      - name: bump version and push
        run: |
          # 读取当前版本
          CURRENT_VERSION=$(sed -n 's/^Version: //p' control | head -n 1)
          echo "Current version: $CURRENT_VERSION"

          # 递增版本号：支持 0.1.7b 格式（数字部分递增，保留字母后缀）
          # 提取最后一个数字并递增
          NEW_VERSION=$(echo "$CURRENT_VERSION" | perl -pe 's/(\d+)(?=\D*$)/$1+1/e')
          echo "New version: $NEW_VERSION"

          # 更新 control 文件
          sed -i "s/^Version: .*/Version: $NEW_VERSION/" control

          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 提交并推送（带 [skip ci] 避免触发循环构建）
          git add control
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
